[project]
name = "buddy-stt-server"
version = "0.1.0"
description = "Local realtime speech-to-text for the buddy app: NVIDIA Parakeet TDT 0.6B v3 on MLX, streamed over a WebSocket."
requires-python = ">=3.10,<3.14"
dependencies = [
    "parakeet-mlx>=0.7",
    "websockets>=13",
    "numpy",
]

[tool.uv]
package = false
